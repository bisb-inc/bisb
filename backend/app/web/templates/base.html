<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Competitive Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
    <script defer src="{{ url_for('static', path='/js/htmx.min.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/app.js') }}"></script>
  </head>
  <body class="min-h-screen bg-paper text-ink antialiased">
    <header class="border-b border-line bg-white">
      <div class="mx-auto flex max-w-[1440px] items-center justify-between px-5 py-4 lg:px-10">
        <a href="/ui/analyses" class="flex items-center gap-3 rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
          <span class="grid size-9 place-items-center rounded-md bg-ink text-sm font-bold text-white" aria-hidden="true">CM</span>
          <span class="text-sm font-semibold tracking-tight">Competitive Monitor</span>
        </a>
        <span class="hidden text-xs text-muted sm:block">Monitoramento competitivo · MVP local</span>
      </div>
    </header>
    <main class="mx-auto max-w-[1440px] px-5 py-8 lg:px-10 lg:py-10">
      {% block content %}{% endblock %}
    </main>
    <footer class="mx-auto max-w-[1440px] px-5 pb-8 text-xs text-muted lg:px-10">
      Fontes simuladas estão identificadas como demonstração.
    </footer>
  </body>
</html>
