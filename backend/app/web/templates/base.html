<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Bisb — Competitive Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
    <script defer src="{{ url_for('static', path='/js/htmx.min.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/app.js') }}"></script>
  </head>
  <body class="min-h-screen bg-paper text-ink antialiased">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <header class="border-b border-line bg-white">
      <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5 lg:px-8">
        <a href="/ui/analyses" class="flex items-center gap-3 rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
          <span class="grid size-8 place-items-center rounded-sm bg-ink text-xs font-bold text-white" aria-hidden="true">B</span>
          <span class="text-sm font-semibold tracking-tight">Bisb <span class="font-normal text-muted">— Competitive Monitor</span></span>
        </a>
        {% if analysis is defined and analysis %}
          <a href="/ui/analyses" class="text-sm text-muted hover:text-ink">Análises</a>
        {% else %}
          <span class="hidden text-xs text-muted sm:block">Monitoramento competitivo</span>
        {% endif %}
      </div>
    </header>
    <main id="main-content" class="mx-auto max-w-7xl px-5 py-8 lg:px-8 lg:py-10">
      {% block content %}{% endblock %}
    </main>
    <footer class="mx-auto max-w-7xl px-5 pb-8 text-xs text-muted lg:px-8">
      Conteúdo de demonstração é identificado na timeline.
    </footer>
  </body>
</html>
