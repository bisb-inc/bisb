[project]
name = "competitive-monitor-backend"
version = "0.1.0"
description = "Monólito FastAPI com REST API e Web UI do Competitive Monitor"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.14,<2",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
